name: masareef
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.1.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.20.2
  excel: ^4.0.2
  path_provider: ^2.1.3
  open_file: ^3.3.2
  pdf: ^3.10.8
  file_picker: ^10.3.7
  shared_preferences: ^2.2.3
  permission_handler: ^12.0.1
  google_fonts: ^6.2.1
  http: ^1.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - asset/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "asset/icons/image_logo.png"
